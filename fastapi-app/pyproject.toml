[project]
name = "fastapi-app"
version = "0.1.0"
description = "Personal site migration to FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
    "pydantic-settings>=2.10.1",
    "pygments>=2.19.2",
    "python-frontmatter>=1.1.0",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
]
