<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title or "Site" }}{% endblock %}</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="site-shell">
            <nav class="site-nav" aria-label="Primary navigation">
                <a href="/" class="{% if request.url.path == '/' %}is-active{% endif %}">Home</a>
                <a href="/blog" class="{% if request.url.path == '/blog' or request.url.path.startswith('/blog/') %}is-active{% endif %}">Blog</a>
                <a href="/projects" class="{% if request.url.path == '/projects' or request.url.path.startswith('/projects/') %}is-active{% endif %}">Projects</a>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="site-shell">
            <nav class="social-nav" aria-label="Social links">
                {% if settings.show_linkedin %}
                <a href="{{ settings.linkedin_url }}" target="_blank" rel="noreferrer" aria-label="LinkedIn">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6.94 8.5H3.56V20h3.38V8.5ZM5.25 3A1.96 1.96 0 1 0 5.3 6.93 1.96 1.96 0 0 0 5.25 3Zm5.18 5.5H7.08V20h3.35v-6.04c0-1.6.3-3.15 2.29-3.15 1.95 0 1.98 1.82 1.98 3.25V20h3.35v-6.62c0-3.25-.7-5.75-4.5-5.75-1.83 0-3.05 1.01-3.55 1.96h-.05V8.5Z"/>
                    </svg>
                </a>
                {% endif %}
                {% if settings.show_github %}
                <a href="{{ settings.github_url }}" target="_blank" rel="noreferrer" aria-label="GitHub">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 1.5a10.5 10.5 0 0 0-3.32 20.46c.52.1.7-.22.7-.5v-1.72c-2.86.62-3.46-1.21-3.46-1.21-.46-1.18-1.14-1.5-1.14-1.5-.94-.64.08-.63.08-.63 1.03.07 1.57 1.06 1.57 1.06.93 1.58 2.43 1.13 3.03.86.09-.67.36-1.13.65-1.39-2.29-.26-4.7-1.14-4.7-5.1 0-1.12.4-2.03 1.05-2.75-.1-.26-.46-1.3.1-2.71 0 0 .86-.28 2.82 1.05a9.75 9.75 0 0 1 5.14 0c1.95-1.33 2.81-1.05 2.81-1.05.57 1.4.21 2.45.1 2.71.66.72 1.05 1.63 1.05 2.75 0 3.97-2.42 4.83-4.72 5.08.37.32.7.95.7 1.92v2.84c0 .27.19.6.7.5A10.5 10.5 0 0 0 12 1.5Z"/>
                    </svg>
                </a>
                {% endif %}
                {% if settings.show_email %}
                <a href="mailto:{{ settings.email_address }}" aria-label="Email">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 5.25A2.25 2.25 0 0 1 5.25 3h13.5A2.25 2.25 0 0 1 21 5.25v13.5A2.25 2.25 0 0 1 18.75 21H5.25A2.25 2.25 0 0 1 3 18.75V5.25Zm2.08-.75L12 9.74l6.92-5.24H5.08ZM19.5 6.37l-6.87 5.2a1.13 1.13 0 0 1-1.26 0L4.5 6.37v12.38c0 .41.34.75.75.75h13.5c.41 0 .75-.34.75-.75V6.37Z"/>
                    </svg>
                </a>
                {% endif %}
                {% if settings.show_twitter %}
                <a href="{{ settings.twitter_url }}" target="_blank" rel="noreferrer" aria-label="Twitter">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18.9 2H22l-6.77 7.73L23.2 22h-6.24l-4.89-6.75L6.17 22H3.06l7.24-8.27L.8 2h6.4l4.41 6.12L18.9 2Zm-1.1 18h1.73L6.25 3.9H4.39L17.8 20Z"/>
                    </svg>
                </a>
                {% endif %}
            </nav>
        </div>
    </footer>
</body>
</html>
