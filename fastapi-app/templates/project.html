{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<article>
    <h1>{{ project.title }}</h1>
    {% if project.status %}
    <p>{{ project.status }}</p>
    {% endif %}
    {% if project.summary %}
    <p>{{ project.summary }}</p>
    {% endif %}
    {{ project.html | safe }}
</article>
{% endblock %}
