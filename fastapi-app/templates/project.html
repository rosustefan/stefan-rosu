{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<article class="detail-page">
    <header class="detail-header">
        <h1>{{ project.title }}</h1>
        {% if project.status %}
        <p class="detail-meta">{{ project.status }}</p>
        {% endif %}
        {% if project.summary %}
        <p class="detail-summary">{{ project.summary }}</p>
        {% endif %}
    </header>
    {{ project.html | safe }}
</article>
{% endblock %}
